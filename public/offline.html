<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오프라인 — 케어푸드</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;background:#F6F4F0;color:#1C1B18;text-align:center;padding:20px}
  .card{max-width:320px}
  .icon{font-size:48px;margin-bottom:16px}
  h1{font-size:18px;font-weight:700;margin:0 0 8px}
  p{font-size:14px;color:#9C9A90;margin:0 0 24px}
  button{background:#C4870A;color:#fff;border:none;padding:12px 28px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
  @media(prefers-color-scheme:dark){body{background:#121110;color:#EAE8E2}p{color:#706E66}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>인터넷 연결이 필요해요</h1>
  <p>네트워크에 연결된 후 다시 시도해주세요</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
