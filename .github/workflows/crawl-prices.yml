name: 가격 크롤러

on:
  schedule:
    # 매일 한국시간 새벽 1시 (UTC 16:00)
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      max_products:
        description: '최대 처리 제품 수'
        required: false
        default: '2000'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase python-dotenv

      - name: Run price crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          CRAWL_MAX: ${{ github.event.inputs.max_products || '2000' }}
          CRAWL_BATCH_SIZE: '500'
        run: cd scripts && python crawl_prices.py --max 500
