name: 미량영양소 보강

on:
  workflow_dispatch:
  schedule:
    # 매주 일요일 KST 06:00 (UTC 21:00)
    - cron: "0 21 * * 0"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests supabase python-dotenv

      - name: Run micronutrient enrichment
        env:
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/enrich_micronutrients.py
