name: 홈플러스 크롤러

on:
  schedule:
    # 매일 KST 04:00 (UTC 19:00) — 오아시스 크롤링 1시간 후
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 모드 (true/false)"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Homeplus crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          ARGS=""
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          python crawl_homeplus.py $ARGS

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-homeplus-log
          path: scripts/crawl_homeplus.log
          retention-days: 7
