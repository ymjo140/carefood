name: 품목제조보고 수집

on:
  schedule:
    # 매주 월요일 KST 04:00 (UTC 19:00 일요일)
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 모드 (incremental, full)"
        required: false
        default: "incremental"
      food_type:
        description: "특정 품목유형만 (비우면 전체)"
        required: false
        default: ""
      max_rows:
        description: "최대 수집 건수 (0=무제한)"
        required: false
        default: "0"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run collection
        env:
          FOOD_REPORT_API_KEY: ${{ secrets.FOOD_REPORT_API_KEY }}
          FOOD_INGREDIENT_API_KEY: ${{ secrets.FOOD_INGREDIENT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          FOOD_TYPE="${{ github.event.inputs.food_type }}"
          MAX_ROWS="${{ github.event.inputs.max_rows || '0' }}"

          ARGS=""
          if [ "$MODE" = "full" ]; then
            ARGS="$ARGS --full"
          else
            ARGS="$ARGS --days 7"
          fi

          if [ -n "$FOOD_TYPE" ]; then
            ARGS="$ARGS --food-type \"$FOOD_TYPE\""
          fi

          if [ "$MAX_ROWS" != "0" ]; then
            ARGS="$ARGS --max-rows $MAX_ROWS"
          fi

          echo "=== 품목제조보고 수집 시작 ==="
          echo "모드: $MODE, 품목유형: ${FOOD_TYPE:-전체}, 최대: ${MAX_ROWS:-무제한}"
          eval python collect_food_reports.py $ARGS
