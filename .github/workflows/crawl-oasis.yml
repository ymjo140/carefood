name: 오아시스마켓 크롤러

on:
  schedule:
    # 매일 KST 03:00 (UTC 18:00) — 컬리 크롤링 1시간 후
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "카테고리 ID (콤마 구분, 비우면 전체)"
        required: false
        default: ""
      test:
        description: "테스트 모드 (true/false)"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Oasis crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          ARGS=""
          if [ -n "${{ github.event.inputs.categories }}" ]; then
            ARGS="$ARGS --categories ${{ github.event.inputs.categories }}"
          fi
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          python crawl_oasis.py $ARGS

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-oasis-log
          path: scripts/crawl_oasis.log
          retention-days: 7
