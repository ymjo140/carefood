name: 11번가 크롤러 (공식 OpenAPI)

on:
  # 매일 실행은 멈춰 둠 — 11번가 OpenAPI 키(ST11_API_KEY)를 받으면 다시 켠다 (KST 03:30 = UTC 18:30)
  # schedule:
  #   - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 모드 (true/false)"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run 11st crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ST11_API_KEY: ${{ secrets.ST11_API_KEY }}
        run: |
          cd scripts
          ARGS=""
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            ARGS="$ARGS --test"
          fi
          python crawl_11st.py $ARGS

      - name: Upload crawl log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-11st-log
          path: scripts/crawl_11st.log
          retention-days: 7
