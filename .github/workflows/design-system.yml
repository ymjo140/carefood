name: design-system

# 1) 푸시·PR 마다: 정적 검사 — 기준 밖 값이 1건이라도 있으면 실패
# 2) Vercel 배포가 끝나면: 배포된 주소로 화면 검사 — 리포트(스크린샷 포함)를 아티팩트로 올림
# 3) 수동 실행: 원하는 주소로 화면 검사

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/ds/**", "DESIGN.md", "package.json", ".github/workflows/design-system.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "scripts/ds/**", "package.json"]
  deployment_status:
  workflow_dispatch:
    inputs:
      base:
        description: "검사할 주소"
        default: "https://carefood-iota.vercel.app"

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 디자인 시스템 정적 검사 (오류 0 이어야 통과)
        run: node scripts/ds/lint.mjs
      - name: 연결 대조 (링크·API·입력 이름이 빠지지 않았는지)
        if: always()
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          node scripts/ds/wiring.mjs --base="$BASE"
      - name: 수치 측정
        if: always()
        run: node scripts/ds/measure.mjs

  test:
    # 돈·상태 계산 시험 (tests/*.test.ts) — 정산·구매확정·환불·반품·마감·1,000줄 나눠 받기. 하나라도 틀리면 실패
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: 패키지 설치 (설치 스크립트 없이 — ffmpeg·sharp 바이너리는 시험에 필요 없다)
        run: npm ci --ignore-scripts
      - name: 시험
        run: npm test

  audit:
    # 운영 배포만 검사한다. 미리보기·배포별 고유 주소는 Vercel 로그인으로 보호돼 있어 화면이 아니라 로그인 창이 찍힌다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright 설치
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: 운영 주소가 이 커밋으로 바뀔 때까지 기다리기
        env:
          BASE: ${{ github.event.inputs.base || 'https://carefood-iota.vercel.app' }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          SHORT="${SHA:0:7}"
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/design-system" | grep -q "$SHORT"; then echo "운영 주소에 $SHORT 반영됨"; exit 0; fi
            sleep 10
          done
          echo "운영 주소가 $SHORT 로 바뀌지 않았어요 — 지금 운영 중인 버전을 검사합니다"
      - name: 화면 검사
        env:
          DS_AUDIT_BASE: ${{ github.event.inputs.base || 'https://carefood-iota.vercel.app' }}
          DS_AUDIT_COMMIT: ${{ github.event.deployment.sha || github.sha }}
          # 11번가 이미지 CDN 은 해외(검사 서버)에서 451 로 막힌다 — 국내 사용자와 무관해 검사에서 뺀다 (리포트에 표시됨)
          DS_AUDIT_IGNORE: 'cdn\.011st\.com'
        run: node scripts/ds/audit.mjs
      - name: 리포트 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds-audit-report
          path: ds-audit/report
          retention-days: 14
