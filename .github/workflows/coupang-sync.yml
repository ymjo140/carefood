# 쿠팡 가격 자동 검색 — 아직 안 찾아본 제품을 우선순위대로, 1분 30회.
# 한 번에 약 5시간 40분(약 1만 개) 돌고, 대기열이 남았으면 스스로 다음 실행을 시작한다 (GitHub 정기 실행은 자주 밀리거나 빠져서).
# 정기 실행(매시 7분)은 끊겼을 때 다시 잇는 예비용 — 같은 그룹이라 겹쳐 돌지 않는다.
# 401·403·429 면 coupang_sync_state 에 6시간 쉬기를 적고 멈춘다 (이어서 시작하지 않음).
# 이 파일을 바꿔 푸시하면 바로 한 번 돈다.
name: coupang-sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/coupang-sync.yml"]

concurrency:
  group: coupang-sync
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 다음 실행을 스스로 시작

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 쿠팡 검색 → product_prices · coupang_lookups
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scripts/verify/coupang_sync.py --max 12000 --per-minute 30 --minutes 340
      - name: 남았으면 다음 실행 시작
        if: success() && hashFiles('coupang-continue') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run coupang-sync.yml --ref main
